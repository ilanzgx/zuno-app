name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.docker/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.docker/**'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    name: API (Spring Boot / Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: apps/api/pom.xml

      - name: Compile and verify classes
        run: |
          chmod +x ./mvnw
          ./mvnw clean test-compile -B -q

  market:
    name: Market Service (FastAPI / Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/market
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/market/uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run test suite
        run: uv run pytest tests/ -v
        env:
          PYTHONPATH: .

  web:
    name: Web Client (Next.js 16 / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000/v1
          NEXT_PUBLIC_API_URL: http://localhost:8080/v1
        run: pnpm --filter @consolidador-investimentos/web build
