server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  config:
    import: optional:file:.env[.properties]

  main:
    lazy-initialization: ${REDIS_SSL:false}

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:${DB_PORT:5432}/${DB_DATABASE:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

# Integrações Externas e Microsserviços
market:
  microservice:
    url: ${MARKET_SERVICE_URL:http://localhost:8000}

brapi:
  url: ${BRAPI_URL:https://brapi.dev}
  token: ${BRAPI_TOKEN:}

jwt:
  secret: ${JWT_SECRET}

# Observabilidade
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      defaults:
        enabled: true
